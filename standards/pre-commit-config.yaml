# prek / pre-commit hooks (ADR-0015). Fast checks only (< 5 s); types + tests run in `just check` / CI.
# Install: `prek install`. Run all: `just lint`. Tools resolve via scripts/tool (.venv/bin, .tools/bin).
exclude: ^scanner/fixtures/plugins/|^scanner/tests/data/

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: ^store/dev/  # why: generated snapshot data, kept byte-exact as the aggregator wrote it
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        # why: the store's search benchmark runs over the full 4,523-plugin dev snapshot
        # (0.9 MB gzipped, generated by `just store-dev-snapshot`, never hand-edited).
        exclude: ^store/dev/store\.json\.gz$
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: scripts/tool ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: scripts/tool ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: shfmt
        name: shfmt
        entry: scripts/tool shfmt -d -i 2 -ci -bn -sr
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck
        entry: scripts/tool shellcheck -x
        language: system
        types: [shell]
      - id: packer-fmt
        name: packer fmt + syntax
        entry: bash -c 'scripts/tool packer fmt -check -diff orchestrator/packer && scripts/tool packer validate -syntax-only orchestrator/packer'
        language: system
        files: ^orchestrator/packer/.*\.pkr\.hcl$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: scripts/tool actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor (workflow security audit)
        entry: scripts/tool zizmor --offline
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: schemas-metaschema
        name: JSON Schemas are valid draft 2020-12
        entry: scripts/tool check-jsonschema --check-metaschema
        language: system
        files: ^(schemas|spec/schemas)/.*\.schema\.json$
      - id: workflows-schema
        name: workflows match the GitHub schema
        entry: scripts/tool check-jsonschema --builtin-schema vendor.github-workflows
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: opsec-validate
        name: examples + fixture expectations validate
        entry: scripts/tool opsec validate -q
        language: system
        files: ^(schemas/examples|scanner/fixtures/expected)/.*\.json$
      - id: fixture-bytes
        name: fixture hidden-unicode bytes intact
        entry: scripts/tool python3 scripts/check_fixture_bytes.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-docs
        name: generated docs fresh, recipes exist, noqa has why
        entry: scripts/tool python3 scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
